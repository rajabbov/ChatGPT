<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="ChatGPT">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#161B2E"/>
  </linearGradient>
  <radialGradient id="glow" cx="78%" cy="45%" r="55%">
    <stop offset="0" stop-color="#34D399" stop-opacity=".28"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".05"/>
  </pattern>
  <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect x="64" y="62" width="44" height="5" rx="2.5" fill="url(#acc)"/>
  <text x="120" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#34D399">ANDROID · AI CHAT</text>
  <text x="62" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#F5F6FA" letter-spacing="-1">ChatGPT</text>
  <text x="64" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#B7BCD0">A native chat client for the OpenAI API,</text><text x="64" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#B7BCD0">built on raw OkHttp.</text>
  <g transform="translate(64,300)"><rect width="70" height="32" rx="16" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".45"/><text x="35" y="21" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#E8EAF2">Kotlin</text></g><g transform="translate(143.6,300)"><rect width="70" height="32" rx="16" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".45"/><text x="35" y="21" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#E8EAF2">OkHttp</text></g><g transform="translate(223.2,300)"><rect width="87" height="32" rx="16" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".45"/><text x="43" y="21" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#E8EAF2">DiffUtil</text></g>
  <g><rect x="800" y="40" width="400" height="320" rx="22" fill="#1E2438" stroke="#2C3450" stroke-width="2"/><rect x="800" y="40" width="400" height="48" rx="22" fill="#252C44"/><rect x="800" y="66" width="400" height="22" fill="#252C44"/><circle cx="830" cy="64" r="12" fill="url(#acc)"/><text x="852" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F5F6FA" text-anchor="start" >ChatGPT client</text><g opacity="0"><rect x="940" y="108" width="240" height="40" rx="16" fill="#34D399"/><text x="955.0" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0D1117" text-anchor="start" >Explain Kotlin coroutines</text><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;.95;1" dur="7s" repeatCount="indefinite"/></g><g opacity="0"><rect x="820" y="160" width="240" height="40" rx="16" fill="#2E3656"/><text x="835" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F6FA" text-anchor="start" >Lightweight threads that…</text><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.27;.95;1" dur="7s" repeatCount="indefinite"/></g><g opacity="0"><rect x="999" y="212" width="181" height="40" rx="16" fill="#34D399"/><text x="1013.8" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0D1117" text-anchor="start" >Show me an example</text><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.52;.95;1" dur="7s" repeatCount="indefinite"/></g><g transform="translate(830,284)" opacity="0"><circle cx="0" cy="0" r="5" fill="#22D3EE"><animate attributeName="cy" values="0;-6;0" dur=".9s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="16" cy="0" r="5" fill="#22D3EE"><animate attributeName="cy" values="0;-6;0" dur=".9s" begin="0.15s" repeatCount="indefinite"/></circle><circle cx="32" cy="0" r="5" fill="#22D3EE"><animate attributeName="cy" values="0;-6;0" dur=".9s" begin="0.3s" repeatCount="indefinite"/></circle><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.75;.95;1" dur="7s" repeatCount="indefinite"/></g><rect x="816" y="318" width="320" height="30" rx="15" fill="#11162A"/><text x="832" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#8B92AB" text-anchor="start" >Type a message…</text><circle cx="1166" cy="333" r="15" fill="#34D399"/><path d="M1160 326 l12 7 -12 7z" fill="#0D1117"/></g>
</g>
</svg>
